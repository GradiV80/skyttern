name: Build Android APK (Cloud Compiler)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Gjør det mulig å starte byggingen manuelt fra GitHub-grensesnittet

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    name: Bygg Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installer avhengigheter
        run: npm ci || npm install --legacy-peer-deps

      - name: Bygg web-appen og synkroniser Capacitor
        run: npm run android:build

      - name: Sett opp Java JDK 21 (Nødvendig for Gradle 8.14+ og Android SDK 35)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Bygg Android APK med Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Last opp ferdig APK som tidsbegrenset nedlasting
        uses: actions/upload-artifact@v4
        with:
          name: skyteapp-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
